# Blok ini ditambahkan ke dalam server { } di /etc/nginx/sites-enabled/default
# oleh scripts/setup.sh (JANGAN edit manual — jalankan ulang script bila berubah).
location = /film { return 301 /film/; }
location ^~ /film/ {
  proxy_pass http://127.0.0.1:3000/film/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # penting untuk streaming: teruskan Range request apa adanya, jangan buffer video
  proxy_buffering off;
  # wajib untuk upload file besar (default Nginx hanya 1 MB):
  client_max_body_size 4G;
  proxy_request_buffering off;
  proxy_send_timeout 1h;
  proxy_read_timeout 1h;
}
